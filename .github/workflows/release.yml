name: Release-Unpackaged

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            ffmpeg_url: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-07-12-47/ffmpeg-n9.0.2-48-gd4070a14ce-win64-lgpl-shared-9.0.zip
          - runtime: win-arm64
            platform: ARM64
            ffmpeg_url: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-07-12-47/ffmpeg-n9.0.2-48-gd4070a14ce-winarm64-lgpl-shared-9.0.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Download FFmpeg
        run: |
          curl.exe -L -o ffmpeg.zip "${{ matrix.ffmpeg_url }}"
          expand-archive ffmpeg.zip -destinationpath ffmpeg_temp
          $binDir = Get-ChildItem -Path ffmpeg_temp -Filter bin -Recurse | Select-Object -First 1
          if ($binDir) {
            Copy-Item -Path "$($binDir.FullName)\*" -Destination "MediaDeck/Assets/" -Force
          }
        shell: pwsh

      - name: Restore dependencies
        run: dotnet restore MediaDeck/MediaDeck.csproj -p:Platform=${{ matrix.platform }}

      - name: Publish
        run: dotnet publish MediaDeck/MediaDeck.csproj -c Release-Unpackaged -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }} -o publish/

      - name: ZIP
        run: Compress-Archive -Path publish/* -DestinationPath MediaDeck-${{ github.ref_name }}-${{ matrix.runtime }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDeck-${{ matrix.runtime }}
          path: MediaDeck-${{ github.ref_name }}-${{ matrix.runtime }}.zip

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          
      - name: Generate release notes from CHANGELOG
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          awk "/## ${TAG}/{flag=1;next}/## v/{flag=0}flag" CHANGELOG.md > RELEASE_NOTE.md
          if [ ! -s RELEASE_NOTE.md ]; then
            echo "No changelog entry found for ${TAG}, using default note."
            echo "Release ${TAG}" > RELEASE_NOTE.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTE.md
          draft: false
          prerelease: false
          files: ./artifacts/**/*.zip